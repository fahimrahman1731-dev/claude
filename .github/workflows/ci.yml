name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import and validate the vocabulary (fails if anything is incomplete)
        run: npm run build:data -- --strict
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
